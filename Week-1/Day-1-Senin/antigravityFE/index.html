<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover tropical paradises, pristine beaches, and ancient cultural destinations across Southeast Asia.">
  <meta name="theme-color" content="#00A9B5">
  <title>Southeast Asia Tropical Destinations | Discover Paradise</title>

  <!-- Prevent Flash of Incorrect Theme (FOIT) -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('user-theme-preference');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = savedTheme || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/components/header.css">
  <link rel="stylesheet" href="css/components/theme-toggle.css">
  <link rel="stylesheet" href="css/components/search.css">
  <link rel="stylesheet" href="css/components/hero.css">
  <link rel="stylesheet" href="css/components/destination-card.css">
  <link rel="stylesheet" href="css/components/footer.css">
</head>
<body data-page="list">

  <!-- Header Component Mounting Point -->
  <header data-component="header" class="site-header"></header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      
      <!-- Hero Component Mounting Point -->
      <div data-component="hero"></div>

      <!-- Section Title -->
      <section class="section-header">
        <div>
          <h2 class="section-title">Popular Tropical Destinations</h2>
          <p class="section-subtitle">Curated islands, cultural landmarks, and nature sanctuaries across Southeast Asia</p>
        </div>
      </section>

      <!-- Status Alerts & Feedback -->
      <div id="errorAlert" class="alert alert-error" style="display: none;" role="alert"></div>

      <!-- Loading State -->
      <div id="loadingIndicator" class="spinner-container" aria-live="polite">
        <div class="spinner"></div>
        <p>Loading breathtaking destinations...</p>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-state-icon">🔍</div>
        <h3>No Destinations Found</h3>
        <p>We couldn't find any destinations matching your search. Try different keywords or clear your search.</p>
      </div>

      <!-- Destination Cards Grid -->
      <div class="destination-grid" data-component="destination-grid" style="display: none;"></div>

    </div>
  </main>

  <!-- Footer Component Mounting Point -->
  <div data-component="footer"></div>

  <!-- Application Entry Point -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
