<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00C9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#92FE9D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#16D9E3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="1920" height="400" fill="url(#skyGradient)"/>
  
  <!-- Sun -->
  <circle cx="1700" cy="120" r="80" fill="#FFD700" opacity="0.9"/>
  <circle cx="1700" cy="120" r="90" fill="#FFA500" opacity="0.3"/>
  
  <!-- Ocean waves -->
  <path d="M 0 400 Q 480 380 960 400 T 1920 400 L 1920 600 L 0 600 Z" fill="url(#oceanGradient)"/>
  <path d="M 0 420 Q 480 400 960 420 T 1920 420 L 1920 600 L 0 600 Z" fill="#0099CC" opacity="0.6"/>
  
  <!-- Palm trees silhouettes -->
  <g opacity="0.3">
    <!-- Left palm -->
    <rect x="150" y="300" width="20" height="150" fill="#2C5F2D"/>
    <ellipse cx="160" cy="280" rx="60" ry="40" fill="#228B22"/>
    <ellipse cx="140" cy="290" rx="50" ry="35" fill="#228B22"/>
    <ellipse cx="180" cy="290" rx="50" ry="35" fill="#228B22"/>
    
    <!-- Right palm -->
    <rect x="1750" y="320" width="20" height="130" fill="#2C5F2D"/>
    <ellipse cx="1760" cy="300" rx="55" ry="38" fill="#228B22"/>
    <ellipse cx="1740" cy="310" rx="45" ry="32" fill="#228B22"/>
    <ellipse cx="1780" cy="310" rx="45" ry="32" fill="#228B22"/>
  </g>
  
  <!-- Clouds -->
  <g opacity="0.6">
    <ellipse cx="300" cy="80" rx="60" ry="30" fill="white"/>
    <ellipse cx="330" cy="75" rx="50" ry="25" fill="white"/>
    <ellipse cx="270" cy="75" rx="45" ry="25" fill="white"/>
    
    <ellipse cx="800" cy="120" rx="70" ry="35" fill="white"/>
    <ellipse cx="835" cy="115" rx="55" ry="30" fill="white"/>
    <ellipse cx="765" cy="115" rx="50" ry="28" fill="white"/>
    
    <ellipse cx="1400" cy="100" rx="65" ry="32" fill="white"/>
    <ellipse cx="1435" cy="95" rx="52" ry="28" fill="white"/>
  </g>
</svg>
