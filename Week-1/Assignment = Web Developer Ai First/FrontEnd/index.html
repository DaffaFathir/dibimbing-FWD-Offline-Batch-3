<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover breathtaking tropical destinations across Southeast Asia. Browse and book your next adventure.">
  <meta name="theme-color" content="#FFFFFF">
  <title>Southeast Asia Destinations - Discover Tropical Paradise</title>
  
  <!-- Skip to main content link for keyboard users -->
  <style>
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: var(--color-primary);
      color: var(--color-text-inverse);
      padding: 8px 16px;
      text-decoration: none;
      z-index: 100;
      border-radius: 0 0 4px 0;
    }
    .skip-link:focus {
      top: 0;
    }
  </style>
  
  <!-- Theme initialization script - prevents FOIT (Flash of Incorrect Theme) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('user-theme-preference');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      
      // Update meta theme-color for mobile browsers
      const metaThemeColor = document.querySelector('meta[name="theme-color"]');
      if (metaThemeColor) {
        metaThemeColor.setAttribute('content', theme === 'dark' ? '#1A1A1A' : '#FFFFFF');
      }
    })();
  </script>
  
  <!-- CSS Files -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components/header.css">
  <link rel="stylesheet" href="css/components/footer.css">
  <link rel="stylesheet" href="css/components/hero.css">
  <link rel="stylesheet" href="css/components/destination-card.css">
  <link rel="stylesheet" href="css/components/search.css">
  <link rel="stylesheet" href="css/components/theme-toggle.css">
  <link rel="stylesheet" href="css/components/notification.css">
</head>
<body data-page="list">
  <!-- Skip to main content link for keyboard navigation -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Header Component -->
  <header data-component="header" role="banner"></header>

  <!-- Main Content -->
  <main id="main-content" class="main-content" role="main">
    <!-- Hero Section -->
    <section data-component="hero" aria-label="Hero banner"></section>

    <!-- Destination Cards Section -->
    <section class="container" aria-label="Destination listings">
      <div data-component="destination-list" role="region" aria-live="polite" aria-atomic="false"></div>
    </section>
  </main>

  <!-- Footer Component -->
  <footer data-component="footer" role="contentinfo"></footer>

  <!-- JavaScript Module -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
