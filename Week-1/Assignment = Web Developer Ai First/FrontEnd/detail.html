<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View comprehensive details and book your tour to tropical Southeast Asian paradises.">
  <meta name="theme-color" content="#00A9B5">
  <title>Destination Details - Southeast Asia Tourist Destinations</title>

  <!-- Prevent Flash of Incorrect Theme (FOIT) -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('user-theme-preference');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <!-- CSS Stylesheets in order -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components/header.css">
  <link rel="stylesheet" href="css/components/footer.css">
  <link rel="stylesheet" href="css/components/hero.css">
  <link rel="stylesheet" href="css/components/destination-card.css">
  <link rel="stylesheet" href="css/components/destination-detail.css">
  <link rel="stylesheet" href="css/components/search.css">
  <link rel="stylesheet" href="css/components/theme-toggle.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="detail">
  <!-- Skip to main content for accessibility -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Header Component Mount -->
  <div data-component="header"></div>

  <!-- Main Content Area -->
  <main id="main-content">
    <div class="container">
      <!-- Destination Detail Component Mount -->
      <div data-component="destination-detail" aria-live="polite"></div>
    </div>
  </main>

  <!-- Footer Component Mount -->
  <div data-component="footer"></div>

  <!-- Application Entry Point -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
