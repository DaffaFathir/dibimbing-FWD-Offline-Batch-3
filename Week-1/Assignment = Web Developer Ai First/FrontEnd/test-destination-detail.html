<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destination Detail Component Test</title>
  
  <!-- CSS Files -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components/destination-detail.css">
  
  <style>
    body {
      padding: var(--spacing-4);
      background: var(--color-bg-primary);
    }
    
    .test-container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .test-header {
      padding: var(--spacing-4) 0;
      border-bottom: 2px solid var(--color-border);
      margin-bottom: var(--spacing-6);
    }
    
    .test-header h1 {
      font-size: var(--font-size-3xl);
      color: var(--color-text-primary);
      margin: 0 0 var(--spacing-2) 0;
    }
    
    .test-header p {
      color: var(--color-text-secondary);
      margin: 0;
    }
    
    .test-controls {
      display: flex;
      gap: var(--spacing-3);
      margin-bottom: var(--spacing-4);
    }
    
    .test-controls button {
      padding: var(--spacing-2) var(--spacing-4);
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: var(--font-size-sm);
    }
    
    .test-controls button:hover {
      background: var(--color-primary-dark);
    }
    
    .event-log {
      margin-top: var(--spacing-6);
      padding: var(--spacing-4);
      background: var(--color-bg-secondary);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
    }
    
    .event-log h2 {
      font-size: var(--font-size-xl);
      color: var(--color-text-primary);
      margin: 0 0 var(--spacing-3) 0;
    }
    
    .event-item {
      padding: var(--spacing-2) var(--spacing-3);
      background: var(--color-bg-primary);
      border-radius: var(--radius-sm);
      margin-bottom: var(--spacing-2);
      font-family: monospace;
      font-size: var(--font-size-sm);
    }
    
    .event-name {
      color: var(--color-primary);
      font-weight: bold;
    }
    
    .event-data {
      color: var(--color-text-secondary);
      margin-left: var(--spacing-2);
    }
  </style>
</head>
<body>
  <div class="test-container">
    <div class="test-header">
      <h1>🏝️ Destination Detail Component Test</h1>
      <p>Testing the DestinationDetail component with sample data and event emission</p>
    </div>
    
    <div class="test-controls">
      <button id="toggleTheme">Toggle Dark Mode</button>
      <button id="runTests">Run Unit Tests</button>
      <button id="clearLog">Clear Event Log</button>
    </div>
    
    <div id="detail-container"></div>
    
    <div class="event-log">
      <h2>Event Log</h2>
      <div id="event-log-content">
        <p style="color: var(--color-text-tertiary); font-style: italic;">
          Click the buttons in the component to see events being emitted
        </p>
      </div>
    </div>
  </div>
  
  <script type="module">
    import { DestinationDetail } from './js/components/destination-detail.js';
    import { eventBus } from './js/event-bus.js';
    import { runDestinationDetailTests } from './js/components/destination-detail.test.js';
    
    // Sample destination data
    const sampleDestination = {
      id: 'dest-001',
      name: 'Bali Paradise Beach',
      location: 'Bali, Indonesia',
      fullDescription: 'Experience the magic of Bali with its pristine beaches, ancient temples, and vibrant culture. This tropical paradise offers stunning sunsets, world-class surfing, lush rice terraces, and warm hospitality. Discover hidden waterfalls, explore traditional villages, and immerse yourself in the spiritual atmosphere of this Indonesian gem. Perfect for adventure seekers, culture enthusiasts, and beach lovers alike.',
      price: 1299,
      imageUrl: 'https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=1200&h=500&fit=crop'
    };
    
    // Initialize component
    const container = document.getElementById('detail-container');
    const detail = new DestinationDetail(container, sampleDestination);
    
    // Event log
    const eventLogContent = document.getElementById('event-log-content');
    
    function logEvent(eventName, data = null) {
      const eventItem = document.createElement('div');
      eventItem.className = 'event-item';
      
      const timestamp = new Date().toLocaleTimeString();
      const eventNameSpan = document.createElement('span');
      eventNameSpan.className = 'event-name';
      eventNameSpan.textContent = eventName;
      
      eventItem.appendChild(eventNameSpan);
      eventItem.appendChild(document.createTextNode(` at ${timestamp}`));
      
      if (data) {
        const dataSpan = document.createElement('span');
        dataSpan.className = 'event-data';
        dataSpan.textContent = ' - ' + JSON.stringify(data, null, 2);
        eventItem.appendChild(dataSpan);
      }
      
      // Clear the initial message if it exists
      if (eventLogContent.querySelector('p[style]')) {
        eventLogContent.innerHTML = '';
      }
      
      eventLogContent.insertBefore(eventItem, eventLogContent.firstChild);
    }
    
    // Listen for events
    eventBus.on('detail:order-click', (data) => {
      console.log('detail:order-click event received:', data);
      logEvent('detail:order-click', { destinationId: data.destinationId, name: data.destination.name });
    });
    
    eventBus.on('detail:back-click', () => {
      console.log('detail:back-click event received');
      logEvent('detail:back-click');
    });
    
    // Theme toggle
    document.getElementById('toggleTheme').addEventListener('click', () => {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      logEvent('theme:change', { theme: newTheme });
    });
    
    // Run tests
    document.getElementById('runTests').addEventListener('click', () => {
      console.log('Running unit tests...');
      const passed = runDestinationDetailTests();
      logEvent('tests:run', { passed });
    });
    
    // Clear log
    document.getElementById('clearLog').addEventListener('click', () => {
      eventLogContent.innerHTML = '<p style="color: var(--color-text-tertiary); font-style: italic;">Event log cleared</p>';
    });
    
    console.log('Destination Detail Test Page Ready');
    console.log('Component initialized with:', sampleDestination);
  </script>
</body>
</html>
